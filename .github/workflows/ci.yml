name: CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Lint for Syntax Errors and Undefined Symbols (E9, F63, F7, F82)
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Lint for Code Style and Complexity
        run: |
          # Exit-zero displays warnings without failing the job
          flake8 . --count --exit-zero --max-complexity=20 --max-line-length=127 --statistics

  test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies & Test Harness
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-edge.txt
          pip install skyfield pytest pytest-cov

      - name: Execute Automated Test Suite
        run: |
          pytest --verbose --cov=src --cov-report=term

  docker-build:
    name: Multi-Arch Docker Build Check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU for Multi-Architecture Emulation
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Multi-Stage Edge Runtime Image (ARM64 / x86_64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: edge-runtime
          platforms: linux/amd64,linux/arm64
          push: false
          tags: space-debris-detection:edge-test
